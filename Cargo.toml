[package]
name = "metatube-cli-rs"
version = "0.1.0"
edition = "2021"
description = "CLI frontend for MetaTube SDK - organize JAV videos by actress"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "signal"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
croner = "2"
notify = "8"
notify-debouncer-mini = "0.7"
thiserror = "2"
chrono = "0.4"
toml = "0.8"
dirs = "6"
urlencoding = "2"
indicatif = "0.17"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
