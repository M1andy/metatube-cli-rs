name: Release
on:
  push:
    tags: ['v*']

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .github/cliff.toml
          args: --latest --strip all

  build:
    needs: changelog
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: metatube-cli-rs-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: metatube-cli-rs-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: metatube-cli-rs-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.body }}
          files: |
            metatube-cli-rs-linux-x86_64/metatube-cli-rs-linux-x86_64
            metatube-cli-rs-windows-x86_64.exe/metatube-cli-rs-windows-x86_64.exe
            metatube-cli-rs-macos-x86_64/metatube-cli-rs-macos-x86_64
